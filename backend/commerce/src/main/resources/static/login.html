<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f5f7; }
    main { width: min(360px, 90vw); padding: 2rem; background: white; border: 1px solid #d9dee3; border-radius: 8px; }
    label, input, button { display: block; width: 100%; box-sizing: border-box; }
    label { margin-top: 1rem; font-weight: bold; }
    input { margin-top: .35rem; padding: .7rem; border: 1px solid #b8c0c8; border-radius: 4px; }
    button { margin-top: 1.25rem; padding: .7rem; color: white; background: #1769aa; border: 0; border-radius: 4px; cursor: pointer; }
    #message { min-height: 1.3rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>Login portal</h1>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
    </form>
    <p id="message" role="status"></p>
  </main>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = document.getElementById('message');
      const response = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      const result = await response.json();
      if (response.ok) {
        message.textContent = 'Login successful. Opening your portal...';
        window.location.href = result.redirect;
      } else {
        message.textContent = result.message;
      }
      message.style.color = response.ok ? 'green' : 'crimson';
    });
  </script>
</body>
</html>
