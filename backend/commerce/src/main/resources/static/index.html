<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commerce Bank</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f5f7; }
    main { width: min(360px, 90vw); padding: 2rem; background: white; border: 1px solid #d9dee3; border-radius: 8px; text-align: center; }
    p { color: #3d4750; }
    a, button { display: block; width: 100%; box-sizing: border-box; margin-top: 1rem; padding: .7rem; border-radius: 4px; font-size: 1rem; text-align: center; text-decoration: none; cursor: pointer; }
    a { color: white; background: #1769aa; }
    button { color: #1769aa; background: white; border: 1px solid #1769aa; }
  </style>
</head>
<body>
  <main>
    <h1>Commerce Bank</h1>
    <p>Manage and view your loans.</p>
    <a href="/login">Log in</a>
    <button type="button">Sign up</button>
  </main>
</body>
</html>
